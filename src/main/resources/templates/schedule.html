<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('스케줄링')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('schedule')}"></nav>

<div class="container">
  <h2>면접 스케줄링</h2>

  <div th:if="${error}" class="alert alert-danger mb-4" style="border-radius: 12px;" th:text="${error}"></div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">지원자 Excel 업로드</h5>
      <form method="post" th:action="@{/schedule}" enctype="multipart/form-data">
        <div class="mb-4">
          <label class="form-label small fw-bold">Excel 파일 (.xlsx)</label>
          <input type="file" name="file" accept=".xlsx" class="form-control" required>
          <div class="form-text mt-2">지원자 명단이 포함된 엑셀 파일을 업로드해 주세요.</div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">스케줄링 방식</label>
          <select name="type" class="form-select">
            <option value="ONLY_HARD">기본 (Hard 제약만, 빠름)</option>
            <option value="OPTIMIZATION">최적화 (최대 60초)</option>
            <option value="HIGH_QUALITY">고품질 (최대 60초)</option>
          </select>
          <div class="form-text mt-2 text-muted small">최적화/고품질 방식은 더 나은 배정 결과를 위해 최대 60초가 소요될 수 있습니다.</div>
        </div>
        <div class="text-end">
          <button type="submit" id="submit-btn" class="btn btn-primary px-5 py-2">스케줄링 실행하기</button>
        </div>
      </form>
    </div>
  </div>

  <div th:if="${result}" class="card">
    <div class="card-body p-0">
      <div class="p-4 d-flex justify-content-between align-items-center border-bottom">
        <h5 class="card-title mb-0">배정 결과 (<span class="text-primary" th:text="${result.dataList.size()}">0</span>명)</h5>
        <a th:href="@{/schedule/download}" class="btn btn-sm btn-outline-success border-success text-success px-3">
          <span class="me-1">📥</span> Excel 다운로드
        </a>
      </div>
      <div class="px-4 py-3 border-bottom bg-light d-flex align-items-center gap-3" style="border-radius: 0;">
        <span class="fw-bold small text-muted">최적화 점수</span>
        <span class="badge fs-6"
              th:classappend="${result.hardScore >= 0} ? 'bg-success' : 'bg-danger'"
              th:text="'Hard: ' + ${result.hardScore}"></span>
        <span class="badge bg-primary fs-6" th:text="'Soft: ' + ${result.softScore}"></span>
        <span class="text-muted small" th:if="${result.hardScore >= 0}">✔ 필수 제약 모두 충족</span>
        <span class="text-danger small fw-bold" th:if="${result.hardScore < 0}">⚠ 일부 필수 제약 미충족</span>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>이름</th>
              <th>성별</th>
              <th>이메일</th>
              <th>지원 파트</th>
              <th>대학</th>
              <th>면접 날짜</th>
              <th>면접 시간</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row : ${result.dataList}">
              <td><span class="fw-bold" th:text="${row.name}"></span></td>
              <td th:text="${row.sex}"></td>
              <td class="text-muted small" th:text="${row.email}"></td>
              <td><span class="badge bg-light text-dark border" th:text="${row.part}"></span></td>
              <td th:text="${row.univ}"></td>
              <td th:text="${row.interviewDate}"></td>
              <td><span class="fw-bold text-primary" th:text="${row.interviewTime}"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="loading-overlay"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(255,255,255,0.85); z-index:9999;
            flex-direction:column; align-items:center; justify-content:center;">
  <div class="spinner-border text-primary" style="width:3rem; height:3rem;" role="status">
    <span class="visually-hidden">로딩 중...</span>
  </div>
  <p class="mt-3 fw-bold" style="color: var(--toss-gray-900);">스케줄링 최적화 중...</p>
  <p class="text-muted small">선택한 방식에 따라 최대 60초 소요될 수 있습니다.</p>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
  document.querySelector('form').addEventListener('submit', function () {
    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('submit-btn').disabled = true;
  });
</script>
</body>
</html>
